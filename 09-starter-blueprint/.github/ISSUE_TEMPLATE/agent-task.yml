name: AI agent task
description: Bounded implementation task with requirements and evidence
body:
  - type: input
    id: task_id
    attributes: { label: Task ID }
    validations: { required: true }
  - type: textarea
    id: objective
    attributes: { label: Objective }
    validations: { required: true }
  - type: input
    id: requirements
    attributes: { label: Requirement IDs }
    validations: { required: true }
  - type: textarea
    id: ownership
    attributes: { label: Owned files and interfaces }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria }
    validations: { required: true }
  - type: textarea
    id: tests
    attributes: { label: Tests and evidence }
    validations: { required: true }
